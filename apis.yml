aid: jetty
name: Jetty
description: >-
  Jetty is a financial-services company built for the real estate industry,
  making renting more accessible and affordable for renters while helping
  property managers reduce risk and bad debt. Following its merger with Rhino,
  Jetty operates across more than 6 million rental units in the United States
  and offers three core products: Jetty Deposit, a security-deposit replacement
  that swaps large cash deposits for a low monthly or one-time payment; Jetty
  Protect, integrated renters insurance and liability coverage; and Jetty
  Credit, a rent-reporting and credit-building service that helps renters
  establish credit history while lowering delinquencies for property managers.
  Jetty is backed by Ribbit Capital. No public developer/API surface is
  currently published; this profile is maintained in the API Evangelist network
  as a company record.
